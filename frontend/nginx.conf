# Sert les fichiers compilés des deux PWA (derrière le reverse proxy nginx/).
# 8080 : backoffice ; 8081 : boutique.
# Règle de cache : les fichiers du service worker, index.html et le manifeste ne sont jamais
# mis en cache par le navigateur (sinon les mises à jour de la PWA seraient bloquées) ;
# les fichiers dont le nom contient un hash sont mis en cache un an.

server {
    listen 8080;
    root /usr/share/nginx/html/backoffice;

    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~* -[A-Z0-9]{8}\.(js|css|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 8081;
    root /usr/share/nginx/html/boutique;

    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~* -[A-Z0-9]{8}\.(js|css|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
