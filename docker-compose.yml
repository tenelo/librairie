name: librairie

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librairie}
      POSTGRES_USER: ${POSTGRES_USER:-librairie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librairie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["web"]
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    environment:
      MEDIA_ROOT: /app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celery_worker:
    <<: *backend
    command: ["worker"]
    volumes:
      - media_files:/app/media
    environment:
      MEDIA_ROOT: /app/media

  celery_beat:
    <<: *backend
    command: ["beat"]

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${BACKOFFICE_PORT:-80}:80"
      - "${BOUTIQUE_PORT:-8081}:8081"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
