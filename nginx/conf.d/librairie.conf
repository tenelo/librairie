# Reverse proxy HTTP (développement Docker et test local).
# :80 → backoffice (personnel), qui expose aussi /api, /ws, /admin, /static et /uploads vers Django.
# En production, remplacer ce fichier par https.conf.example (voir README, section Certbot).

# 20 requêtes par minute et par adresse IP sur /api/auth/ (connexion, mot de passe).
limit_req_zone $binary_remote_addr zone=librairie_auth:10m rate=20r/m;

upstream django {
    server backend:8000;
}

upstream frontend_backoffice {
    server frontend:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/librairie-backend.conf;

    location / {
        proxy_pass http://frontend_backoffice;
        proxy_set_header Host $host;
    }
}
