# Reverse proxy HTTP (développement Docker et test local).
# :80   → backoffice (personnel)      :8081 → boutique (clients)
# Les deux exposent /api, /ws, /admin, /static et /uploads vers Django.
# En production, remplacer ce fichier par https.conf.example (voir README, section Certbot).

upstream django {
    server backend:8000;
}

upstream frontend_backoffice {
    server frontend:8080;
}

upstream frontend_boutique {
    server frontend:8081;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/librairie-backend.conf;

    location / {
        proxy_pass http://frontend_backoffice;
        proxy_set_header Host $host;
    }
}

server {
    listen 8081;
    server_name _;
    include /etc/nginx/snippets/librairie-backend.conf;

    location / {
        proxy_pass http://frontend_boutique;
        proxy_set_header Host $host;
    }
}
