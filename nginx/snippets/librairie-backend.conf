# Routes communes vers Django, incluses dans chaque bloc server.

client_max_body_size 20m;
server_tokens off;

# Compression des réponses texte (API JSON, fichiers de l'application).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

# En-têtes de sécurité (complétés par HSTS dans la configuration HTTPS).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "serial=(self), camera=(self), geolocation=(), microphone=()" always;

# Limitation de débit des points d'authentification (en plus de celle de Django).
location /api/auth/ {
    limit_req zone=librairie_auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /admin/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket (notifications temps réel via Django Channels)
location /ws/ {
    proxy_pass http://django;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

location /static/ {
    alias /var/www/static/;
    expires 30d;
}

# Fichiers déposés (logos, photos produits)
location /uploads/ {
    alias /var/www/media/;
    expires 7d;
}
